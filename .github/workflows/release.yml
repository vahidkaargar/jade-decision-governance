name: release
# A push of a tag v<version> tests the tagged commit, builds the wheel and sdist, installs the wheel in an isolated directory and runs it
# (scripts/verify_install.sh), then creates or updates the GitHub release for that tag with the wheel, the sdist and SHA256SUMS attached.
# `jade upgrade` installs from this release. Cut one with: git tag -a vX.Y.Z -m "X.Y.Z" && git push origin vX.Y.Z (docs/08, release).
# The first job refuses a tag that is not on origin/main (a tag on a side branch) and a tag with no CHANGELOG.md section (scripts/check_release_tag.sh).
# Every other job waits for it. Actions are pinned by commit sha; Dependabot updates them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# W-201: the test job runs the full suite before the tag is published. As in ci.yml, a run where the real approver anchor exists stops with an error
# instead of quietly skipping the subprocess approval modules (tests/conftest.py).
env:
  JADE_REQUIRE_APPROVE_MODULES: "1"

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch origin/main
        run: git fetch --quiet --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
      - name: The tag is on origin/main and CHANGELOG.md has its section
        run: sh scripts/check_release_tag.sh "$GITHUB_REF_NAME"

  test:
    needs: guard
    runs-on: ubuntu-latest
    # The suite has 15 800 tests: serial it runs far past 20 minutes, in parallel about 20 to 28 on a hosted runner (CI run 44597504328 took 28 minutes and
    # was cut by a 30 minute limit). The same two steps as ci.yml, and a limit with room.
    # The suite grew with the wave 7 lane merges: the same steps took up to 59m34s in CI (W-242), and 45 would cancel the release.
    # 60 is the same limit as the CI test job (tests/test_ci_workflow.py allows at most 60 there).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install uv (pinned)
        run: pip install --quiet uv==0.13.6
      - name: Sync dev environment
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Contract and policy tests (parallel)
        run: uv run pytest -q -n auto --dist loadgroup -m "not timing"
      - name: Wall-clock budget tests (serial)
        run: uv run pytest -q -m timing
      - name: Regression and adversarial case replay
        run: uv run python evals/run_cases.py

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install uv (pinned)
        run: pip install --quiet uv==0.13.6
      - name: The tag names the package version
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          code=$(python3 -c 'import re, pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("jade/__init__.py").read_text()).group(1))')
          [ "$have" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $have" >&2; exit 1; }
          [ "$code" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match jade.__version__ $code" >&2; exit 1; }
      - name: Build the wheel and the sdist
        run: uv build --out-dir dist
      - name: Install the built wheel in an isolated directory and run it
        env:
          UV_OFFLINE: "0"
          VERIFY_INSTALL_DIST: dist
        run: sh scripts/verify_install.sh
      - name: Write SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          notes=$(mktemp)
          # The notes are the CHANGELOG section of this version; the release is a prerelease when the version is not X.Y.Z.
          # The guard job has already checked that the section exists and is not empty; there is no fallback text.
          awk -v v="${tag#v}" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > "$notes"
          [ -n "$(tr -d '[:space:]' < "$notes")" ] || { echo "no CHANGELOG.md section for ${tag#v}" >&2; exit 1; }
          pre=""
          printf '%s' "${tag#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || pre="--prerelease"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes" $pre
            gh release upload "$tag" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --title "$tag" --notes-file "$notes" --verify-tag $pre
          fi
