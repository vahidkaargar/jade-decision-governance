# Risk classification: ordered precedence rules. First match wins. Evaluated by `jade hook pretool`
# and `jade decide classify`. Patterns are Python `re` applied to the whitespace-normalised command
# (Bash) or the absolute path (Write/Edit). This file is GENERIC and public. Hosts, paths and extra
# rules specific to one machine live in a gitignored overlay `policies/local/risk.local.yaml`
# (see policies/local/risk.local.example.yaml and policies/loader.py for the merge rules).
schema_version: 1.0.0
environments:
  production_hosts: []        # overlay adds host names / IPs; any command naming one => environment=production
  production_paths: ["/etc/", "/Library/LaunchDaemons/", "/usr/local/", "/opt/homebrew/etc/"]
  staging_markers: ["staging", "preview", "\\.test\\b", "localhost", "127\\.0\\.0\\.1"]
rules:
  - id: R-01
    level: critical
    reversibility: irreversible
    blast_radius: public
    match: "\\b(pfctl|iptables|nft|ufw)\\b|(?i:/etc/pf\\.conf)"
    rationale: "Firewall change: human approval required"
  - id: R-02
    level: critical
    reversibility: irreversible
    blast_radius: host
    match: "\\bsudo\\b.*(launchctl (bootout|unload|disable)|systemctl (disable|mask)|rm -rf /(?![a-zA-Z])|diskutil|fdisk|mkfs|dd if=)"
    rationale: "Destructive privileged operation on boot services or disks"
  - id: R-03
    level: critical
    reversibility: irreversible
    blast_radius: org
    match: "\\b(kubectl (apply|delete|rollout|scale)|helm (install|upgrade|uninstall)|terraform (apply|destroy)|ansible-playbook|fly deploy|vercel --prod|cap \\S+ deploy)\\b"
    rationale: "Production deploy"
  - id: R-04
    level: critical
    reversibility: irreversible
    blast_radius: org
    data_sensitivity: secret
    match: "security (add|delete)-generic-password|ovault secret (set|import|rm|delete)|(?i:vault_key|id_(rsa|ed25519|ecdsa)\\b|\\.pem\\b)|BEGIN [A-Z ]*PRIVATE KEY"
    rationale: "Key material or secret-store mutation"
  - id: R-10
    level: high
    reversibility: partially_reversible
    blast_radius: public
    match: "\\b(git push|gh (pr|release) (create|merge)|glab mr (create|merge)|npm publish|cargo publish|twine upload|docker push|composio execute)\\b"
    rationale: "External side effect: publish, push, send, act in a connected app"
  - id: R-11
    level: high
    reversibility: irreversible
    blast_radius: repo
    match: "git (reset\\b[^;&|]*--hard|push --force|branch\\b[^;&|]* -D\\b|clean\\b[^;&|]* -[a-zA-Z]*(f[a-zA-Z]*d|d[a-zA-Z]*f))|\\brm -rf (?!/private/tmp|/tmp|\\$TMPDIR|\\./?(node_modules|dist|build|\\.venv|target)\\b)"
    rationale: "Destroys local history or files"
  - id: R-12
    level: high
    reversibility: partially_reversible
    blast_radius: host
    match: "\\b(launchctl (bootstrap|load|enable|kickstart)|systemctl (start|stop|restart|enable)|crontab -|docker (compose )?(up|down|rm)|brew services)\\b|/Library/LaunchAgents/.*\\.plist"
    rationale: "Service lifecycle on this host"
  - id: R-13
    level: high
    reversibility: reversible
    blast_radius: host
    match: "(?i:\\.claude/(settings(\\.local)?\\.json|hooks/|CLAUDE\\.md)|\\bAGENTS\\.md\\b|\\.cursor/rules|\\.ai/rules\\.md|policies/(safety|promotion|risk)\\.yaml|policies/local/|\\.config/jade/|\\.local/share/jade/|(?:^|[/\\s])jade/(permits|hooks|ledger|policy|shellnorm|decide|state_machine)\\.py\\b|evals/[^/\\s]+/protected/)|\\bjade (improve (promote|rollback)|ledger purge|label set)\\b"
    rationale: "Changes agent policy, hooks or protected targets"
  - id: R-14
    level: high
    reversibility: partially_reversible
    blast_radius: service
    match: "(^|[;&|] *)(ssh|scp|sftp) (?!-keygen|-add|-agent|-copy-id)|\\brsync\\b.* \\S+:"
    rationale: "Any remote shell or copy (hosts in the overlay's critical list escalate to critical via a prepended rule)"
  - id: R-15
    level: high
    reversibility: partially_reversible
    blast_radius: host
    match: "^git:unsafe-config "
    rationale: "git -c (alias, pager, editor, sshCommand, fsmonitor, hooksPath, credential, url ...) or --exec-path can run a program or redirect a remote"
  - id: R-20
    level: medium
    reversibility: reversible
    blast_radius: repo
    match: "\\bgit (merge|rebase|reset(?! --hard)|stash drop)\\b"
    rationale: "Rewrites or discards local repo state, recoverable via reflog"
  - id: R-90
    level: low
    reversibility: reversible
    blast_radius: repo
    match: "\\bgit (commit|checkout|switch|add)\\b|\\b(pip|pip3) install\\b|\\bbrew install\\b|\\buv (add|remove|tool install|pip install)\\b|\\bnpm (install|ci)\\b|\\bcomposer (require|install)\\b|\\b(curl|wget) .*(-o|-O|--output)\\b"
    rationale: "Commits, checkouts, installs and downloads are routine and reversible"
  - id: R-99
    level: low
    reversibility: reversible
    blast_radius: file
    match: ".*"
    rationale: "Default: read, local edit, test, build"
# Classification works per simple command (pipeline segment). A segment whose command word matches one of
# these patterns and that does not redirect output to a file only reads, so it is `low` whatever it mentions:
# `grep pfctl notes.md` is not a firewall change. Heredoc bodies and quoted prose are ignored for the same reason.
# git global options (`-C`, `-c`, `--no-pager` ...) are removed by jade/shellnorm.py before these patterns run, so
# every git pattern here and every git rule above sees `git <subcommand> ...`.
read_only:
  - "^(cat|head|tail|wc|ls|ll|stat|which|type|whereis|pwd|whoami|id|uname|printenv|echo|printf|true|false|test|\\[|grep|egrep|fgrep|jq|cut|tr|column|nl|diff|cmp|comm|basename|dirname|realpath|readlink|du|df|ps|pgrep|lsof|netstat|sw_vers|md5|shasum|sha256sum|hexdump|strings|cd|pushd|popd|export|set|unset|sleep|wait)\\b"
  # Verbs that CAN write are read-only only without the flag or operand that makes them write (output file, in-place, exec, program text).
  - "^sort\\b(?!.*(\\s-[a-zA-Z]*o|\\s--output|\\s--compress-program))"
  - "^uniq\\b(?!(?:\\s+-\\S+)*\\s+(?!\\d+(?:\\s|$))[^-\\s]\\S*\\s+(?!\\d+(?:\\s|$))[^-\\s]\\S*)"
  - "^xxd\\b(?!.*\\s-[a-zA-Z]*r)(?!(?:\\s+-\\S+)*\\s+(?!\\d+(?:\\s|$))[^-\\s]\\S*\\s+(?!\\d+(?:\\s|$))[^-\\s]\\S*)"
  - "^(awk|gawk|mawk|nawk)\\b(?!.*(@script!|\\s-f\\b|\\s-i\\b|\\s--(file|include|load)))"
  - "^(sed|gsed)\\b(?!.*(\\s-[a-zA-Z]*[iI]|\\s--in-place|@script!|\\s-[a-zA-Z]*f\\b|\\s--file))"
  - "^find\\b(?!.*\\s-(delete|exec|execdir|ok|okdir|fprint0?|fprintf|fls)\\b)"
  - "^(less|more)\\b(?!.*\\s-[a-zA-Z]*[oO])"
  - "^(bat|man)\\b(?!.*(\\s--pager|\\s-[PHw]\\b|\\s--html))"
  - "^(rg|ag|ack)\\b(?!.*(--pre\\b|--pager|--hostname-bin))"
  - "^fd\\b(?!.*\\s(-x|-X|--exec|--exec-batch)\\b)"
  - "^tree\\b(?!.*\\s-[a-zA-Z]*o)"
  - "^yq\\b(?!.*(\\s-[a-zA-Z]*i|\\s--inplace))"
  - "^date\\b(?!.*(\\s-[a-zA-Z]*s|\\s--set))"
  - "^file\\b(?!.*\\s-[a-zA-Z]*C)"
  - "^git (status|log|diff|show|rev-parse|ls-files|ls-remote|blame|describe|shortlog|reflog(?! (expire|delete))|cat-file|fetch|remote( -v)?$|remote get-url|branch( -[avr]+| --list| --show-current)*$|tag( -l| --list)?$|stash list)\\b(?!.*(--output\\b|--upload-pack|--receive-pack|--exec\\b))"
  - "^(gh|glab) (pr|mr|issue|run|repo|release|workflow) (view|list|status|checks|diff|watch)\\b"
  - "^docker (compose )?(ps|images|logs|inspect|info|version|stats|top)\\b"
  - "^launchctl (list|print)\\b"
  - "^(kubectl|helm) (get|describe|logs|list|status|version|top)\\b"
  - "^systemctl (status|is-active|is-enabled|list-units)\\b"
  - "^(ssh|scp) -V$"
  - "^jade (ledger (stats|show)|permit (list|show|request)|question|check|work (list|render)|gate status|hooks status|eval|label (queue|auto)|decide (show|list)|route|ops (status|drift))\\b"
# MCP tools are classified by tool name (the PreToolUse matcher includes `mcp__.*`). A tool whose input carries a
# shell command (`command`, `cmd`, `script`) is classified by that command exactly like Bash. First match wins.
mcp_tools:
  - { id: M-01, level: critical, blast_radius: org, reversibility: irreversible, rationale: "Cluster change through an MCP server",
      match: "^mcp__.*(kubectl_(apply|create|delete|patch|scale|rollout|generic)|exec_in_pod|(install|upgrade|uninstall)_helm_chart|node_management|cleanup)$" }
  - { id: M-02, level: high, blast_radius: public, reversibility: partially_reversible, rationale: "Repository or CI change through an MCP server (merge, commit, branch, pipeline, review, comment)",
      match: "^mcp__.*GitLab__(accept_merge_request|save_merge_request|save_merge_request_review|add_commit|add_branch|save_pipeline|fork_repository|save_work_item|save_note|link_work_items)$" }
  - { id: M-03, level: high, blast_radius: host, reversibility: partially_reversible, rationale: "Delete, kill or move through an MCP server",
      match: "^mcp__.*(delete_(file|project|session)|kill_process|force_terminate|move_file|write_file|edit_block|clean_up_worktrees|discard_kept_worktree)$" }
mcp_command_keys: ["command", "cmd", "script"]
permit_required_at: high          # high and critical require an ISSUED permit at PreToolUse
human_approval_required_at: high  # PENDING -> ISSUED only via an interactive TTY for high and critical
