# Risk classification: ordered precedence rules. First match wins. Evaluated by `jade hook pretool`
# and by `jade decide open --command <command>`. Patterns are Python `re` applied to the whitespace-normalised command
# (Bash) or the absolute path (Write/Edit). This file is GENERIC and public. Hosts, paths and extra
# rules specific to one machine live in a gitignored overlay `policies/local/risk.local.yaml`
# (see policies/local/risk.local.example.yaml and policies/loader.py for the merge rules).
schema_version: 1.0.0
environments:
  production_hosts: []        # overlay adds host names / IPs; any command naming one => environment=production
  production_paths: ["/etc/", "/Library/LaunchDaemons/", "/usr/local/", "/opt/homebrew/etc/"]
  staging_markers: ["staging", "preview", "\\.test\\b", "localhost", "127\\.0\\.0\\.1"]
rules:
  - id: R-01
    level: critical
    reversibility: irreversible
    blast_radius: public
    # The command word, not a file name that ends in it (`fw.nft`): a dot before the name is a file extension.
    match: "(?<![\\w.])(pfctl|iptables|nft|ufw)\\b|(?i:/etc/pf\\.conf)"
    rationale: "Firewall change: human approval required"
  - id: R-02
    level: critical
    reversibility: irreversible
    blast_radius: host
    match: "\\bsudo\\b.*(launchctl (bootout|unload|disable)|systemctl (disable|mask)|rm -rf /(?![a-zA-Z])|diskutil|fdisk|mkfs|dd if=)"
    rationale: "Destructive privileged operation on boot services or disks"
  - id: R-03
    level: critical
    reversibility: irreversible
    blast_radius: org
    match: "\\b(kubectl (apply|delete|rollout|scale)|helm (install|upgrade|uninstall)|terraform (apply|destroy)|ansible-playbook|fly deploy|vercel --prod|cap \\S+ deploy)\\b"
    rationale: "Production deploy"
  - id: R-04
    level: critical
    reversibility: irreversible
    blast_radius: org
    data_sensitivity: secret
    match: "security (add|delete)-generic-password|ovault secret (set|import|rm|delete)|(?i:vault_key|id_(rsa|ed25519|ecdsa)\\b|\\.pem\\b)|BEGIN [A-Z ]*PRIVATE KEY"
    rationale: "Key material or secret-store mutation"
  - id: R-17
    level: high
    reversibility: partially_reversible
    blast_radius: repo
    # Defeats the standalone pre-push guard (`jade git-hook script`, SI-08): git then does not run the hook that sees the real remote ref. R-10 and R-15 already
    # rate a push and `git -c` high; this rule says why, and adds what they miss: `git config core.hooksPath` (a persistent change), a write to the
    # repository's own pre-push file, `chmod`/`rm`/`mv` of it. Reading one (`git config --get core.hooksPath`, `cat .git/hooks/pre-push`) is not matched.
    # The environment route (`GIT_CONFIG_KEY_0=core.hooksPath ... git push`, `GIT_CONFIG_PARAMETERS`) is matched by name.
    # The `git:hooks-bypass` marker is added by jade/policy.py when `git -c core.hooksPath=...` (or `--config-env`) is on the command line.
    match: "(?i:^git:hooks-bypass |^git:unsafe-config .*core\\.hookspath|\\bgit push\\b[^;&|]*\\s--no-ve\\w*|\\bgit config\\b(?![^;&|]*\\s(?:--get\\S*|--list|-l|--show-\\S+)\\b)[^;&|]*core\\.hookspath|\\.git/hooks/pre-push\\b|\\bGIT_CONFIG_(?:KEY_\\d+|PARAMETERS)=\\S*core\\.hookspath)"
    rationale: "Defeats the pre-push guard that stops a push to the default branch (--no-verify, core.hooksPath, or an edit of the pre-push hook): git would not run the check that sees the real remote ref"
  - id: R-10
    level: high
    reversibility: partially_reversible
    blast_radius: public
    match: "\\b(git push|gh (pr|release) (create|merge)|glab mr (create|merge)|npm publish|cargo publish|twine upload|docker push|composio execute)\\b"
    rationale: "External side effect: publish, push, send, act in a connected app"
  - id: R-11
    level: high
    reversibility: irreversible
    blast_radius: repo
    match: "git (reset\\b[^;&|]*--ha(?:rd?)?\\b|push --force|branch\\b(?:(?=[^;&|]*\\s-[a-zA-Z]*D)|(?=[^;&|]*\\s(?:-[a-zA-Z]*d|--delete\\b))(?=[^;&|]*\\s(?:-[a-zA-Z]*f|--force\\b)))|clean\\b(?=[^;&|]*\\s(?:-[a-zA-Z]*f|--f(?:o(?:r(?:ce?)?)?)?\\b))(?=[^;&|]*\\s-[a-zA-Z]*d))|\\brm -rf (?!/private/tmp|/tmp|\\$TMPDIR|\\./?(node_modules|dist|build|\\.venv|target)\\b)"
    rationale: "Destroys local history or files"
  - id: R-12
    level: high
    reversibility: partially_reversible
    blast_radius: host
    match: "\\b(launchctl (bootstrap|bootout|load|unload|enable|disable|kickstart|remove|stop|kill|submit|unsetenv)|systemctl (start|stop|restart|enable)|crontab -|docker (compose )?(up|down|rm)|brew services)\\b|(?i:/library/launchagents/.*\\.plist)"
    rationale: "Service lifecycle on this host"
  - id: R-13
    level: high
    reversibility: reversible
    blast_radius: host
    # Hook wiring and JADE's own runtime artifacts: the ledger (jade.sqlite and its -wal/-shm/-journal files, permits live in it),
    # calibration/current.json, pins.json, the config and local overlays, the installed package and the uv tool dir, the jade and jev launchers, the
    # policy files and the agent instruction files. The human-only CLI writes them from Python, not through a gated tool call. The repository's own
    # Python code is R-16 (write targets only).
    # `files_only` (like R-16): the rule looks at what a command WRITES (the destination of cp/rsync/ln/install, the archive of tar -c, redirect
    # targets, the output options of an otherwise read-only tool), or at the whole segment for a command that may write any operand, and never
    # at a command named in `inert_for_files` or a `read_only` verb without a redirect: `git add AGENTS.md`, `cp ~/.claude/settings.json /tmp/b`,
    # `printf 'policies/local/' > .gitignore` are not changes to a protected file. A Write/Edit path is always a target.
    files_only: true
    match: "(?i:\\.claude/(settings[\\w.-]*\\.json|hooks/|CLAUDE\\.md)|\\bAGENTS\\.md\\b|\\.cursor/rules|\\.ai/rules\\.md|policies/(?:[\\w-]+\\.(?:yaml|py)|local/)|\\.config/jade(?![\\w.-])|\\.local/share/jade(?![\\w.-])|jade\\.sqlite(?:-(?:wal|shm|journal))?(?![\\w.])|calibration/current\\.json|uv/tools/jade(?:-decision-governance)?(?![\\w-])|evals/[^/\\s]+/protected/|\\.local/bin/(?:jade|jev)(?![\\w.-])|\\buv tool (?:uninstall|upgrade|reinstall)\\b[^;&|]*\\bjade|\\buv tool install\\b[^;&|]*\\bjade)|\\bjade (improve (promote|rollback)|ledger purge|label set)\\b"
    rationale: "Changes agent policy, hooks, JADE's own ledger, config or installed code, or another protected target"
  - id: R-16
    level: high
    reversibility: reversible
    blast_radius: host
    # JADE's own code in a checkout (every jade/*.py, so the TTY gate in util.py and its callers in cli.py/ops.py/improve.py are covered too).
    # `files_only`: the rule matches the WRITE TARGETS of a command (the
    # destination of cp/rsync/ln/install, the archive of tar -c, redirect targets), or the whole segment for a command that may write any
    # operand, and never a segment named in `inert_for_files` below (git add, ruff check, pytest ... only read their operands). A Write/Edit
    # path is always a target.
    files_only: true
    match: "(?i:(?<![\\w.-])jade/(?:[\\w*?\\[\\]-]*\\.py\\b|_\\w+/|\\*|(?=\\s|$)))"
    rationale: "Changes JADE's own code (the gate, the permit and TTY checks, the ledger, the CLI)"
  - id: R-18
    level: high
    reversibility: reversible
    blast_radius: host
    # CREATING a skill, command or agent instruction file (W-54, decided 2026-11-09): a new file under `.claude/skills|commands|agents/`, `.agents/`,
    # `.cursor/skills|commands|agents/` or `.skills-archive/` is read by the agent as instructions the human never saw (T3). Editing a file that
    # already exists stays low: the agent maintains its own skills daily. `creates_only` (jade/policy.py `_creates`): a path that resolves to an
    # existing regular file is an edit; a path that does not exist, an existing directory (the call puts something into it), a glob, a variable or
    # an unresolved relative path counts as a creation. `files_only` as for R-13: it looks at what a command writes (redirect targets, the
    # destination of cp/mv/ln/install/rsync, `git clone` destinations, `curl -o`, `tar -C`, or the whole segment for a verb that may write any
    # operand) and never at a read, a grep, an `ls`, a `git add`, or a path inside quoted prose or a heredoc body. A removal creates nothing.
    # A Write/Edit/MultiEdit path is always a target. `CLAUDE.md` and the settings files stay R-13; the human installs a skill from a terminal.
    files_only: true
    creates_only: true
    match: "(?i:(?<![\\w.-])\\.(?:claude/(?:skills|commands|agents)|agents|cursor/(?:skills|commands|agents)|skills-archive)/)"
    rationale: "Creates a skill, command or agent instruction file the human has not seen (editing an existing one is not gated)"
  - id: R-14
    level: high
    reversibility: partially_reversible
    blast_radius: service
    match: "(^|[;&|] *)(ssh|scp|sftp) (?!-keygen|-add|-agent|-copy-id)|\\brsync\\b.* \\S+:"
    rationale: "Any remote shell or copy (hosts in the overlay's critical list escalate to critical via a prepended rule)"
  - id: R-15
    level: high
    reversibility: partially_reversible
    blast_radius: host
    match: "^git:unsafe-config "
    rationale: "git -c (alias, pager, editor, sshCommand, fsmonitor, hooksPath, credential, url ...), --exec-path or a GIT_* environment variable (GIT_SSH_COMMAND, GIT_PAGER, GIT_CONFIG_*) can run a program or redirect a remote"
  - id: R-20
    level: medium
    reversibility: reversible
    blast_radius: repo
    match: "\\bgit (merge|rebase|reset(?! --hard)|stash drop)\\b"
    rationale: "Rewrites or discards local repo state, recoverable via reflog"
  - id: R-90
    level: low
    reversibility: reversible
    blast_radius: repo
    match: "\\bgit (commit|checkout|switch|add)\\b|\\b(pip|pip3) install\\b|\\bbrew install\\b|\\buv (add|remove|tool install|pip install)\\b|\\bnpm (install|ci)\\b|\\bcomposer (require|install)\\b|\\b(curl|wget) .*(-o|-O|--output)\\b"
    rationale: "Commits, checkouts, installs and downloads are routine and reversible"
  - id: R-99
    level: low
    reversibility: reversible
    blast_radius: file
    match: ".*"
    rationale: "Default: read, local edit, test, build"
# Classification works per simple command (pipeline segment). A segment whose command word matches one of
# these patterns and that does not redirect output to a file only reads, so it is `low` whatever it mentions:
# `grep pfctl notes.md` is not a firewall change. Heredoc bodies and quoted prose are ignored for the same reason.
# git global options (`-C`, `-c`, `--no-pager` ...) are removed by jade/shellnorm.py before these patterns run, so
# every git pattern here and every git rule above sees `git <subcommand> ...`.
read_only:
  - "^(cat|head|tail|wc|ls|ll|stat|which|type|whereis|pwd|whoami|id|uname|printenv|echo|printf|true|false|test|\\[|grep|egrep|fgrep|jq|cut|tr|column|nl|diff|cmp|comm|basename|dirname|realpath|readlink|du|df|ps|pgrep|lsof|netstat|sw_vers|md5|shasum|sha256sum|hexdump|strings|cd|pushd|popd|export|set|unset|sleep|wait)\\b"
  # Verbs that CAN write are read-only only without the flag or operand that makes them write (output file, in-place, exec, program text).
  - "^sort\\b(?!.*(\\s-[a-zA-Z]*o|\\s--output|\\s--compress-program))"
  - "^uniq\\b(?!(?:\\s+-\\S+)*\\s+(?!\\d+(?:\\s|$))[^-\\s]\\S*\\s+(?!\\d+(?:\\s|$))[^-\\s]\\S*)"
  - "^xxd\\b(?!.*\\s-[a-zA-Z]*r)(?!(?:\\s+-\\S+)*\\s+(?!\\d+(?:\\s|$))[^-\\s]\\S*\\s+(?!\\d+(?:\\s|$))[^-\\s]\\S*)"
  - "^(awk|gawk|mawk|nawk)\\b(?!.*(@script!|\\s-f\\b|\\s-i\\b|\\s--(file|include|load)))"
  - "^(sed|gsed)\\b(?!.*(\\s-[a-zA-Z]*[iI]|\\s--in-place|@script!|\\s-[a-zA-Z]*f\\b|\\s--file))"
  - "^find\\b(?!.*\\s-(delete|exec|execdir|ok|okdir|fprint0?|fprintf|fls)\\b)"
  - "^(less|more)\\b(?!.*\\s-[a-zA-Z]*[oO])"
  - "^(bat|man)\\b(?!.*(\\s--pager|\\s-[PHw]\\b|\\s--html))"
  - "^(rg|ag|ack)\\b(?!.*(--pre\\b|--pager|--hostname-bin))"
  - "^fd\\b(?!.*\\s(-x|-X|--exec|--exec-batch)\\b)"
  - "^tree\\b(?!.*\\s-[a-zA-Z]*o)"
  - "^yq\\b(?!.*(\\s-[a-zA-Z]*i|\\s--inplace))"
  - "^date\\b(?!.*(\\s-[a-zA-Z]*s|\\s--set))"
  - "^file\\b(?!.*\\s-[a-zA-Z]*C)"
  - "^git (status|log|diff|show|rev-parse|ls-files|ls-remote|blame|describe|shortlog|reflog(?! (expire|delete))|cat-file|fetch|remote( -v)?$|remote get-url|branch( -[avr]+| --list| --show-current)*$|tag( -l| --list)?$|stash list)\\b(?!.*(--output\\b|--upload-pack|--receive-pack|--exec\\b))"
  - "^(gh|glab) (pr|mr|issue|run|repo|release|workflow) (view|list|status|checks|diff|watch)\\b"
  - "^docker (compose )?(ps|images|logs|inspect|info|version|stats|top)\\b"
  - "^launchctl (list|print)\\b"
  - "^(kubectl|helm) (get|describe|logs|list|status|version|top)\\b"
  - "^systemctl (status|is-active|is-enabled|list-units)\\b"
  - "^(for|select) \\S+ in\\b|^case\\b|^(done|fi|esac|elif)$"   # shell syntax: the commands in the body are segments of their own
  - "^(ssh|scp) -V$"
  - "^jade (ledger (stats|show)|permit (list|show|request)|question|check|work (list|render)|gate status|hooks status|eval|label (queue|auto)|decide (show|list)|route|ops (status|drift)|git-hook (script|check))\\b"
# Commands that only READ their path operands (or touch the git index, not the file). R-16 (`files_only`) never fires on them, so `git add jade/hooks.py`,
# `ruff check jade/policy.py` and `uv run pytest jade/x.py` stay low. Everything else that names a protected code or policy file is gated, because an
# unknown command may write any operand; cp, rsync, ln, install and tar -c are narrowed to their destination by jade/policy.py instead.
inert_for_files:
  - "^git (add|status|diff|log|show|blame|ls-files|grep|commit|check-ignore|update-index|stash list|rev-parse|describe|shortlog)\\b"
  - "^git restore --staged\\b(?!.*(--worktree|\\s-[a-zA-Z]*W))"
  - "^git rm (-\\S+ )*--cached\\b"
  - "^(uv run (-\\S+ )*|python[\\d.]* -m )?(ruff (check|rule|linter|config|version)\\b(?!.*(--fix|--add-noqa|--unsafe-fixes))|ruff format\\b(?=.*--(check|diff)\\b)|mypy|pytest|py_compile|compileall|flake8|pylint|pyright|bandit|vulture|pycodestyle|radon)\\b"
  - "^(open|code|cursor|subl|zed)\\b"
  - "^[A-Za-z_]\\w*\\+?=\\S*( [A-Za-z_]\\w*\\+?=\\S*)*$"   # a variable assignment alone sets a shell variable (what it expands to is a segment of its own)
  - "^mkdir\\b"   # creates directories, never the content of a file (`mkdir -p policies/local`, `mkdir -p jade`)
# Tools that are not Bash are classified by tool name (the PreToolUse matcher names the built-in ones and `mcp__.*`). A tool whose
# input carries a shell command (`command`, `cmd`, `script`) is classified by that command exactly like Bash, and also by the first
# specific (non-generic) rule that names the tool; the higher level wins. First match wins in this list. A rule with `paths: true` also
# applies the path rules (R-01/R-04/R-12/R-13/R-16 and production paths) to the tool's path arguments. A `generic` rule is a name heuristic
# and is skipped when a command string decides. A tool nothing names is M-99 (medium, recorded and listed by `jade check`, not gated).
mcp_tools:
  - { id: M-01, level: critical, blast_radius: org, reversibility: irreversible, rationale: "Cluster change through an MCP server",
      match: "^mcp__.*(kubectl_(apply|create|delete|patch|scale|rollout|generic)|exec_in_pod|(install|upgrade|uninstall)_helm_chart|node_management|cleanup)$" }
  - { id: M-02, level: high, blast_radius: public, reversibility: partially_reversible, rationale: "Repository or CI change through an MCP server (merge, commit, branch, pipeline, review, comment)",
      match: "^mcp__.*GitLab__(accept_merge_request|save_merge_request|save_merge_request_review|add_commit|add_branch|save_pipeline|fork_repository|save_work_item|save_note|link_work_items)$" }
  - { id: M-03, level: high, blast_radius: host, reversibility: partially_reversible, paths: true, rationale: "Delete, kill, move or write files or processes through an MCP server",
      match: "^mcp__.*(delete_(file|project|session)|kill_process|force_terminate|move_file|rename_file|copy_file|write_file|write_pdf|edit_block|edit_file|create_directory|clean_up_worktrees|discard_kept_worktree)$" }
  - { id: M-04, level: high, blast_radius: host, reversibility: partially_reversible,
      rationale: "Changes agent permissions, settings, scheduling, connectors, the tool surface, or starts or steers another session (governance wiring)",
      match: "^mcp__.+?__(set_session_(permission_mode|model|effort|fast_mode|output_style)|set_(setting|config_value|remote_control|session_connector_enabled)|(create|update|delete|run)_scheduled_task|mcp-(add|remove|config-set|create-profile|activate-profile)|send_message|start_session|move_to_cloud|stop_session|archive_session|clear_session|set_auto_merge|bind_pr|reconnect_session_connector)$" }
  - { id: M-05, level: high, blast_radius: host, reversibility: partially_reversible,
      rationale: "Runs another tool or arbitrary code by name through a gateway, or starts an agent outside this session's hooks: the gate cannot see what it calls",
      match: "^(RemoteTrigger|mcp__.+?__(?:\\w+_)?(?:mcp-exec|code-mode|run_code_unsafe|run_code|executeCode|execute_code))$" }
  - { id: M-06a, level: low, blast_radius: file, rationale: "Interface-only MCP tool (sidebar, panes, window layout, session title, PR monitor toggle, terminal tabs): changes how the app looks, not what runs",
      match: "^mcp__ccd_(?:sidebar|view|window)__|^mcp__ccd_session_mgmt__set_session_title$|^mcp__ccd_pr__set_monitor$|^mcp__terminal__(?:open|stop)_terminal_tab$" }
  - { id: M-06, level: low, blast_radius: file, rationale: "MCP tool with a read-only name",
      match: "^mcp__.+?__(?:get|list|read|search|find|query|describe|show|status|info|ping|logs?|view|fetch|resolve|snapshot|screenshot|scrape|wait|explain|check|count|version|inspect|dump|stat|tree|take|hover|start_search|stop_search|smart_search|skills_get|skills_search|rules_always|rules_search|query-docs|resolve-library-id)(?:[_-]|$)" }
  - { id: M-07, level: high, blast_radius: host, reversibility: partially_reversible, paths: true, generic: true,
      rationale: "MCP tool whose name says it mutates, executes or sends, and that no specific rule names",
      match: "^mcp__.+?__(?:set|write|edit|create|update|delete|remove|move|rename|exec|execute|run|shell|apply|merge|deploy|install|uninstall|kill|terminate|patch|publish|push|commit|save|add|drop|truncate|restart|stop|start|send|post|put)(?:[_-]|$)" }
  - { id: M-08, level: medium, blast_radius: service, reversibility: partially_reversible,
      rationale: "Runs a script in a page, uploads a local file or drives the browser: recorded, deliberately not gated (a permit per page action would stall browser automation; residual risk in docs/05 T18)",
      match: "^mcp__.+?__(?:javascript_tool|(?:browser_)?evaluate|execute_javascript|(?:browser_)?file_upload|upload_image|app_key|computer)$" }
  - { id: M-99, level: medium, blast_radius: service, generic: true,
      rationale: "MCP tool with no rule and no read-only name: recorded, not gated (add a rule when it can mutate)",
      match: "^mcp__" }
mcp_command_keys: ["command", "cmd", "script"]
# Tools that type or pipe an argument into a running shell or another tool: those strings are ALSO classified as shell commands and the
# higher level wins (`*` = every string under the input). Typing `git push origin x` into a terminal is the push.
mcp_shell_inputs:
  - { match: "^mcp__.+?__interact_with_process$", keys: [input] }
  - { match: "^mcp__.+?__(app_type|Type|type|Shortcut|computer_batch|app_batch|teach_batch|app_key|key)$", keys: ["*"] }
  - { match: "^mcp__.+?__(mcp-exec|code-mode)$", keys: ["*"] }
permit_required_at: high          # high and critical require an ISSUED permit at PreToolUse
human_approval_required_at: high  # from this level a permit must carry a human principal and tty reference (read by policy.human_floor; never above high)
